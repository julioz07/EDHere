# Correções ao pt-BR do Forge, que é a língua do bot para quem usa a app em
# português (de Portugal). Só as frases que aparecem a jogar contra o bot.
# O build_forge.py troca cada chave daqui no ficheiro do Forge; as perguntas
# comuns com "Você quer/deseja/pode/tem" passam a "Queres/Podes/Tens" por regra.

# o registo junta "{jogador} {ação} {carta}": a ação tem de ser um pretérito
lblCast=lançou
lblActivated=ativou
lblTriggered=desencadeou
lblLogZoneChange={0} passou de {2} para {1}.
lblLogPlayerHasRestoredControlThemself={0} recuperou o controlo sobre si mesmo
lblLogPlayerReceivesNPosionCounterFrom={0} recebe {1} marcador(es) de veneno de {2}
lblLogPlayerControlledTargetPlayer={0} passa a ser controlado por {1}

# a moeda e quem começa
lblYouHaveWonTheCoinToss={0}, ganhaste na moeda.
lblYouLostTheLastGame={0}, perdeste o último jogo.
lblWouldYouLiketoPlayorDraw=Queres começar ou comprar?
lblYouAreGoingFirst=vais primeiro\!
lblYouAreGoing=vais
lblIsGoingFirst=começa
lblPlay=Começar
lblDraw=Comprar
# com vários jogadores, quem começa escolhe-se nos botões da app (não há retratos)
lblWhoWouldYouLiketoStartthisGame=Quem começa?

# a pagar, o cancelar do ataque e o pagamento de mana
lblPayManaCost=Paga\:
lblCallBack=Limpar ataque
