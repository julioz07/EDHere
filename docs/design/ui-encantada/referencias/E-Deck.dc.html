<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Deck</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Crimson+Pro:ital,wght@1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E8CB80}a:hover{color:#F6E2A8}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gem{position:relative;overflow:hidden;border:none;cursor:pointer;color:#FFFFFF;background:linear-gradient(180deg,#86B6FF 0%,#4682F2 42%,#2149B8 100%);box-shadow:0 0 0 1.5px #D8B868,0 0 0 3px #0A0D18,0 0 0 4px rgba(216,184,104,.35),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -5px 10px rgba(10,20,80,.45),0 0 24px rgba(70,130,255,.5)}
.sect{display:flex;align-items:center;gap:10px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#D8B868}
.sect::before,.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(216,184,104,0),rgba(216,184,104,.6))}
.sect::after{background:linear-gradient(90deg,rgba(216,184,104,.6),rgba(216,184,104,0))}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0D18; font-family: Inter, system-ui, sans-serif; color: #F2ECDD; display: flex; flex-direction: column">

  <div style="height: 168px; flex: none; position: relative; overflow: hidden; background: linear-gradient(180deg,#F6B26B 0%,#D9663A 50%,#8E2E1C 100%)">
    <div style="position: absolute; inset: 0; background: #4A160E; clip-path: polygon(0 100%,0 62%,16% 46%,30% 58%,48% 30%,64% 50%,80% 34%,100% 46%,100% 100%)"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,13,24,.35) 0%, rgba(10,13,24,.1) 35%, #0A0D18 100%)"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; padding: 0 6px">
      <button aria-label="Voltar" style="width: 44px; height: 44px; border: none; background: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></button>
      <span style="flex: 1"></span>
      <button aria-label="Testar" style="width: 44px; height: 44px; border: none; background: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l12 8-12 8z" fill="currentColor"></path></svg></button>
      <button aria-label="Vista em grelha" style="width: 44px; height: 44px; border: none; background: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"></rect><rect x="13" y="4" width="7" height="7" rx="1"></rect><rect x="4" y="13" width="7" height="7" rx="1"></rect><rect x="13" y="13" width="7" height="7" rx="1"></rect></svg></button>
      <button aria-label="Partilhar" style="width: 44px; height: 44px; border: none; background: none; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 14px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: Cinzel, Georgia, serif; font-weight: 800; font-size: 28px; line-height: 1.05; color: #FFF6DA; text-shadow: 0 2px 10px rgba(0,0,0,.6)">Krenko Goblins</span>
      <span style="font-size: 13px; font-weight: 500; color: #E3D4B0">Commander · 100/100 · bracket 1–2</span>
    </div>
  </div>

  <div role="tablist" aria-label="Secções do deck" style="height: 48px; flex: none; display: flex; position: relative">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, rgba(216,184,104,0), rgba(216,184,104,.5) 50%, rgba(216,184,104,0))"></span>
    <button role="tab" aria-selected="true" style="flex: 1; position: relative; border: none; background: none; cursor: pointer; font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 14px; color: #E8CB80">Cartas<span aria-hidden="true" style="position: absolute; left: 22%; right: 22%; bottom: 0; height: 2px; background: #E8CB80; box-shadow: 0 0 10px #E8CB80"></span><span aria-hidden="true" style="position: absolute; left: 50%; bottom: -4px; margin-left: -4px; width: 8px; height: 8px; transform: rotate(45deg); background: #FBEBB8; box-shadow: 0 0 8px #FBEBB8"></span></button>
    <button role="tab" aria-selected="false" style="flex: 1; border: none; background: none; cursor: pointer; font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 14px; color: #A9B0C8">Estatísticas</button>
    <button role="tab" aria-selected="false" style="flex: 1; border: none; background: none; cursor: pointer; font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 14px; color: #A9B0C8; display: flex; align-items: center; justify-content: center; gap: 6px">Validação<span style="width: 16px; height: 16px; border-radius: 8px; background: radial-gradient(circle at 35% 30%, #9BF0B4, #2E9E55); box-shadow: 0 0 8px rgba(80,220,130,.6); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="color: #0A2A14; stroke-width: 4"><path d="M5 12l5 5 9-10"></path></svg></span></button>
  </div>

  <div style="flex: none; display: flex; gap: 10px; padding: 14px 16px 6px">
    <div style="flex: 1; min-width: 0; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 12px; background: #0E1326; box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 0 0 1px rgba(216,184,104,.4)">
      <svg width="18" height="18" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="color: #D8B868"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-5-5"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Procurar no deck</label>
      <input id="q" size="1" placeholder="Procurar no deck" style="flex: 1; min-width: 0; width: 100%; border: none; background: none; outline: none; color: #F2ECDD; font-family: Inter, sans-serif; font-size: 15px">
    </div>
    <div role="group" aria-label="Agrupar por" style="height: 46px; flex: none; display: flex; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(216,184,104,.6)">
      <button aria-pressed="true" style="padding: 0 12px; border: none; cursor: pointer; font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 13px; color: #1A120C; background: linear-gradient(180deg, #FFF6DA, #E8CB80)">Tipo</button>
      <button aria-pressed="false" style="padding: 0 12px; border: none; cursor: pointer; font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 13px; color: #E8CB80; background: #121831">Custo</button>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 12px 16px 0; gap: 10px">
    <span class="sect">Comandante · 1</span>
    <div style="display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(180deg, #1C2442, #121831); box-shadow: 0 0 0 1px rgba(232,203,128,.7), 0 0 18px rgba(232,203,128,.18)">
      <div style="{{cmd.box}}"><span style="{{cmd.crown}}"></span><span style="{{cmd.bar}}"></span><span style="{{cmd.art}}"><span style="{{cmd.hill}}"></span></span><span style="{{cmd.tline}}"></span><span style="{{cmd.textbox}}"></span></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 17px">Krenko, Mob Boss</span>
        <span style="display: flex; gap: 3px"><sc-for list="{{cmdCost}}" as="o" hint-placeholder-count="3"><span style="{{o.style}}">{{o.t}}</span></sc-for></span>
        <span style="font-family: 'Crimson Pro', Georgia, serif; font-style: italic; font-weight: 500; font-size: 15px; color: #A9B0C8">Criatura Lendária — Goblin Guerreiro</span>
      </div>
    </div>
    <span class="sect" style="margin-top: 6px">Criaturas · 28</span>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="height: 76px; flex: none; display: flex; align-items: center; gap: 12px; position: relative">
        <span style="width: 22px; text-align: center; font-family: Cinzel, Georgia, serif; font-weight: 800; font-size: 16px; color: #E8CB80">1</span>
        <div style="{{r.box}}"><span style="{{r.bar}}"></span><span style="{{r.art}}"><span style="{{r.hill}}"></span></span><span style="{{r.tline}}"></span><span style="{{r.textbox}}"></span></div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-family: Cinzel, Georgia, serif; font-weight: 700; font-size: 15px; line-height: 1.2">{{r.name}}</span>
          <span style="font-family: 'Crimson Pro', Georgia, serif; font-style: italic; font-weight: 500; font-size: 15px; line-height: 1.2; color: #A9B0C8">{{r.type}}</span>
        </div>
        <span style="display: flex; gap: 3px; flex: none; align-self: flex-start; padding-top: 14px"><sc-for list="{{r.cost}}" as="o" hint-placeholder-count="1"><span style="{{o.style}}">{{o.t}}</span></sc-for></span>
        <span aria-hidden="true" style="position: absolute; left: 34px; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, rgba(216,184,104,.35), rgba(216,184,104,0))"></span>
      </div>
    </sc-for>
  </div>

  <button aria-label="Adicionar cartas" class="gem" style="position: absolute; right: 20px; bottom: 26px; width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" class="ic" aria-hidden="true" style="stroke-width: 2.6"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const HILLS = [
      'polygon(0 100%,0 62%,22% 40%,38% 58%,60% 28%,80% 52%,100% 38%,100% 100%)',
      'polygon(0 100%,0 70%,30% 46%,50% 64%,72% 34%,100% 60%,100% 100%)',
      'polygon(0 100%,0 54%,18% 66%,44% 30%,66% 56%,86% 44%,100% 66%,100% 100%)',
      'polygon(0 100%,0 74%,40% 36%,58% 50%,100% 30%,100% 100%)',
    ];
    const mini = (i, W, legend) => ({
      box: 'position:relative;width:' + W + 'px;height:' + Math.round(W * 1.4) + 'px;flex:none;box-sizing:border-box;border-radius:4px;padding:2px;background:linear-gradient(180deg,#D0603F,#8E2E1C);display:flex;flex-direction:column;gap:2px;box-shadow:' +
        (legend ? '0 0 0 1.5px #E8CB80,0 0 14px rgba(232,203,128,.5),' : '0 0 0 1px rgba(0,0,0,.6),') + '0 4px 8px rgba(0,0,0,.5)',
      crown: legend ? 'position:absolute;left:50%;top:-7px;margin-left:-11px;width:22px;height:8px;background:#E8CB80;clip-path:polygon(0 100%,12% 20%,30% 70%,50% 0,70% 70%,88% 20%,100% 100%)' : 'display:none',
      bar: 'display:block;height:' + Math.round(W / 9) + 'px;border-radius:2px;background:#F3D9C6',
      art: 'display:block;flex:1.2;border-radius:1px;position:relative;overflow:hidden;background:linear-gradient(180deg,#F6B26B 0%,#D9663A 55%,#8E2E1C 100%)',
      hill: 'position:absolute;inset:0;background:#4A160E;clip-path:' + HILLS[i % 4],
      tline: 'display:block;height:' + Math.round(W / 10) + 'px;border-radius:2px;background:#F3D9C6',
      textbox: 'display:block;flex:.7;border-radius:1px;background:rgba(245,235,220,.85)',
    });
    const orb = (t) => ({ t: t === 'R' ? '' : t, style: 'width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;' +
      (t === 'R' ? 'background:radial-gradient(circle at 35% 30%,#FFC2A8,#E0502A 55%,#7A1E0C);box-shadow:0 0 6px rgba(224,80,42,.6),0 0 0 1px rgba(0,0,0,.5)' : 'color:#1A120C;background:radial-gradient(circle at 35% 30%,#F4F1EA,#B8B2A6 60%,#6E685C);box-shadow:0 0 0 1px rgba(0,0,0,.5)') });
    const cmd = mini(0, 52, true);
    const cmdCost = ['2', 'R', 'R'].map(orb);
    const rows = [
      ['Foundry Street Denizen', 'Criatura — Goblin Guerreiro', ['R']],
      ['Goblin Bushwhacker', 'Criatura — Goblin Guerreiro', ['R']],
      ['Goblin Guide', 'Criatura — Goblin Batedor', ['R']],
      ['Goblin Lackey', 'Criatura — Goblin', ['R']],
    ].map(([n, t, c], i) => Object.assign(mini(i + 1, 46, false), { name: n, type: t, cost: c.map(orb) }));
    return { cmd: cmd, cmdCost: cmdCost, rows: rows };
  }
}
</script>
</body>
</html>
