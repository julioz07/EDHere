plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Chave de upload da Play Store: lida de android/key.properties (fora do
// Git). Sem esse ficheiro, a release é assinada com a chave de debug.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.juliocr.edhere"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    // Java 17, como o Forge. Também é o que faz o AGP converter os records do
    // Forge nos builds de debug (só liga os "global synthetics" acima do Java 14).
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.juliocr.edhere"
        // Android 7.0+: a Proteção automática do Google Play exige o SDK 24.
        minSdk = 24
        // A Play Store pede o Android 16 (API 36).
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // -PsignWithDebugKey: release assinada com a chave de debug, para a
            // instalar por cima da de debug sem perder os dados (testar o R8)
            signingConfig = keystorePropertiesFile.exists() && !project.hasProperty("signWithDebugKey")
                    ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Motor do Forge para o bot (GPL-3.0) e as bibliotecas de que precisa.
    // Gerados por tool/forge/build_forge.py (fora do git).
    implementation fileTree(dir: "libs/forge", include: ["*.jar"])
}

configurations.configureEach {
    // O AndroidX traz o ListenableFuture à parte; o Guava do Forge já o tem.
    exclude group: "com.google.guava", module: "listenablefuture"
}
